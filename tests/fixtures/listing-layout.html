<!doctype html>
<html lang="en"><meta charset="utf-8"><title>StayTube listing layout regression fixture</title>
<style>
  html { font: 14px Arial,sans-serif; }
  body { margin: 20px; }
  ytd-video-renderer, yt-lockup-view-model, ytd-playlist-video-renderer { display:block; width:580px; max-width:100%; margin:16px 0; padding:12px; box-sizing:border-box; border:1px solid #ccc; }
  #metadata-line, #video-info, .ytContentMetadataViewModelMetadataRow { display:flex; flex-wrap:nowrap; gap:4px; overflow:hidden; white-space:nowrap; }
  #metadata-line > span + span::before { content:'•'; margin-right:4px; }
  .ytContentMetadataViewModelMetadataText { display:inline-block; overflow:hidden; white-space:nowrap; }
  a { color:#065fd4; }
</style>

</ytd-video-renderer>
